<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a2530" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3EC"/>
      <stop offset="100%" stop-color="#FFC2D4"/>
    </linearGradient>
  </defs>
  
  <!-- Polaroid Frame -->
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Photo Area -->
  <rect x="42" y="42" width="316" height="316" rx="6" fill="url(#photoGrad)"/>
  
  <!-- Subtle decorative illustration inside photo area -->
  <circle cx="200" cy="180" r="65" fill="#FFFFFF" opacity="0.6"/>
  <text x="200" y="195" font-size="54" text-anchor="middle" font-family="'Caveat', cursive, sans-serif">✨💖✨</text>
  <text x="200" y="235" font-size="16" fill="#7A4B5B" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600">Your Favorite Memory</text>
  
  <!-- Handwritten Caption on Polaroid Footer -->
  <text x="200" y="415" font-family="'Caveat', cursive" font-size="28" font-weight="700" fill="#2E222A" text-anchor="middle">Devanshi's Special Day ✨</text>
</svg>
