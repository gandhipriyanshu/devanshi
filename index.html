<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Birthday Devanshi ✨</title>
  
  <!-- Open Graph & Social Preview -->
  <meta name="description" content="A warm, handmade birthday celebration for Devanshi.">
  <meta property="og:title" content="Happy Birthday Devanshi! 🎂✨">
  <meta property="og:description" content="Make a wish and blow out the candle!">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cake.css">
</head>
<body>

  <!-- Ambient Golden Glow -->
  <div class="ambient-glow" id="ambient-glow" aria-hidden="true"></div>

  <!-- Twinkling Starlight -->
  <div class="starlight-container" id="starlight-container" aria-hidden="true"></div>

  <!-- Audio Controller -->
  <button id="audio-toggle" class="audio-toggle-btn" aria-label="Play background music" title="Toggle Music">
    <span class="music-icon">🎵</span>
  </button>
  <audio id="bg-audio" src="assets/audio/birthday-chime.wav" loop preload="auto"></audio>

  <!-- Main Viewport -->
  <div class="app-viewport">
    <main class="page-container" id="cake-page">
      
      <!-- Greeting Header -->
      <header class="cake-header">
        <h1 class="hero-title" aria-label="Happy Birthday Devanshi">
          <span class="title-line">Happy Birthday</span>
          <span class="title-line name-line">Devanshi</span>
        </h1>
      </header>

      <!-- Cake Showcase -->
      <div class="cake-showcase-container" id="cake-stage">
        
        <!-- Ambient Shadow Under Cake -->
        <div class="cake-shadow-podium" aria-hidden="true"></div>

        <!-- Interactive Real Cake Wrapper -->
        <div class="cake-wrapper" id="cake-wrapper" title="Tap candle to blow it out">
          
          <!-- Candlelight Reflection on Cake Glaze -->
          <div class="cake-candlelight-reflection" id="cake-reflection" aria-hidden="true"></div>

          <!-- Real Chocolate Birthday Cake Image -->
          <img src="assets/images/cake.png" alt="Devanshi's Chocolate Birthday Cake" class="real-cake-img" id="cake-img">

          <!-- Slender Golden Candle Mounted on Top -->
          <div class="candle-container" id="candle" role="button" tabindex="0" aria-label="Birthday Candle. Tap or press enter to blow out.">
            
            <!-- Candle Smoke Wisp (Triggered on blow) -->
            <div class="smoke-particle" id="smoke" aria-hidden="true"></div>

            <!-- Animated Golden Flame -->
            <div class="candle-flame-wrapper" id="flame" aria-hidden="true">
              <svg class="flame-svg" viewBox="0 0 30 50">
                <defs>
                  <radialGradient id="outerFlame" cx="50%" cy="65%" r="60%">
                    <stop offset="0%" stop-color="#FFF275" />
                    <stop offset="45%" stop-color="#FF951C" />
                    <stop offset="100%" stop-color="#E63946" />
                  </radialGradient>
                  <radialGradient id="innerFlame" cx="50%" cy="65%" r="55%">
                    <stop offset="0%" stop-color="#FFFFFF" />
                    <stop offset="60%" stop-color="#FFF176" />
                    <stop offset="100%" stop-color="#FFA000" />
                  </radialGradient>
                </defs>
                <!-- Outer Aura -->
                <path d="M 15 0 C 18 12, 28 24, 28 35 C 28 44, 22 50, 15 50 C 8 50, 2 44, 2 35 C 2 24, 12 12, 15 0 Z" fill="url(#outerFlame)"/>
                <!-- Inner Bright Core -->
                <path d="M 15 13 C 17 21, 23 29, 23 37 C 23 44, 19 48, 15 48 C 11 48, 7 44, 7 37 C 7 29, 13 21, 15 13 Z" fill="url(#innerFlame)"/>
                <!-- Base Blue Spark -->
                <ellipse cx="15" cy="46" rx="5" ry="2.5" fill="#60A5FA" opacity="0.6"/>
              </svg>
            </div>

            <!-- Wick -->
            <div class="candle-wick" aria-hidden="true"></div>

            <!-- Golden Striped Candle Stick -->
            <div class="candle-stick" aria-hidden="true"></div>
          </div>

        </div>

        <!-- Tap to Blow Button -->
        <div class="blow-controls-row" id="blow-controls">
          <button type="button" class="tap-blow-pill" id="quick-blow-btn" aria-label="Tap to blow out candle">
            💨 Tap to blow
          </button>
        </div>

      </div>

      <!-- Interactive Hint -->
      <div class="hint-wrapper">
        <div class="interactive-pill" id="wish-hint">
          <span class="magic-star">✨</span>
          <span id="hint-text">Blow out the candle to send your wish</span>
        </div>
      </div>

      <!-- Action Button (Revealed after wish) -->
      <footer class="action-area">
        <a href="letter.html" class="btn btn-luxury letter-reveal-btn" id="letter-btn">
          <span>Open your letter</span> 💌
        </a>
      </footer>

    </main>
  </div>

  <!-- Canvas Confetti Library for Silky Smooth Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  
  <!-- Scripts -->
  <script src="js/shared.js"></script>
  <script src="js/cake.js"></script>
</body>
</html>
